<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="icon" href="./assets/icons/..." type="image/svg+xml"> -->
    <title>Soulmatic Sounds</title>
    <!-- #region  LINKS  -->
    <link rel="stylesheet" href="./css/general.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./css/media-querries.css">
    <!-- #endregion -->
    <!-- ------------------------------------------------------------- -->
    <!-- #region  SCRIPT  -->
    <script defer src="./js/json-basket.js"></script>
    <script defer src="./js/json-image-info.js"></script>
    <script defer src="./js/json-product-catalog.js"></script>
    <script defer src="./js/templates.js"></script>
    <script defer src="./script.js"></script>
    <!-- #endregion -->
    <!-- ------------------------------------------------------------- -->
</head>

<body>
    <!--__________  HEADER  __________-->
    <header class="MainHeader">
        <div id="idLogoWrapper" class="LogoWrapper">
            <img src="./assets/icons/logo.svg" alt=" dsaf">
            <img src="./assets/icons/lettering.svg" alt="">
        </div>
        <button type="button" class="MenuButton Hide">
            <img src="./assets/icons/burger-menu-button.svg" alt="">
        </button>
    </header>
    <!-- ------------------------------------------------------------- -->

    <!-- __________  MAIN   __________-->
    <main>
        <section id="idHeroSection" class="HeroSection">


        </section>
    </main>
    <!-- ------------------------------------------------------------- -->

    <!-- __________  FOOTER  __________-->
    <footer class="MainFooter">

        <section id="idInternalLinks" class="InternalLinks">
            <a href="./html/imprint.html">Imprint</a>
            <a href="./html/cookie-preferences.html">Cookie Preferences</a>
        </section>

        <div id="idCopyrightWrapper" class="CopyrightWrapper">
            <img src="./assets/icons/copyright.svg" alt="copy">
            <p>Soulmatic Sounds</p>
        </div>
    </footer>
    <!-- ------------------------------------------------------------- -->
    <!-- #region  MOBILE NAVIGATION  -->
    <nav id="idMobileNavigation" class="MobileNavigation Show">
        <ul id="idMobileNavigationLinkWrapper" class="MobileNavigationLinkWrapper Show">
            <li id="idMobileNavigationLinkHome" class="MobileNavigationLinkHome">
                <a id="idLinkToHome" class="MobileNavigationLink">
                    <button id="idHomeButton" type="button" class="MobileNavigationButton">
                        <img id="idHomeIcon" class="HomeIcon" src="./assets/icons/home-button.svg" alt="house icon">
                    </button>
                </a>
            </li>
            <li id="idMobileNavigationProfileLink" class="MobileNavigationProfileLink">
                <a id="idLinkToProfile" class="MobileNavigationLink">
                    <button id="idProfileButton" type="button" class="MobileNavigationButton">
                        <img id="idProfileIcon" class="ProfileIcon" src="./assets/icons/profile-button.svg"
                            alt="silhouette of a person icon">
                    </button>
                </a>
            </li>
            <li id="idMobileNavigationOrderHistoryLink" class="MobileNavigationOverviewLink">
                <a id="idLinkToOrderHistory" class="MobileNavigationLink">
                    <button type="button" id="idOrderHistoryButton" class="MobileNavigationButton OrderHistoryButton">
                        <img id="idOrderHistoryIcon" class="OrderHistoryIcon"
                            src="./assets/icons/order-history-button.svg" alt="order overview list icon ">
                    </button>
                </a>
            </li>
            <li id="idMobileNavigationShoppingCartLink" class="MobileNavigationLinkHome">

                <a id="" class="MobileNavigationLink">
                    <button type="button" id="idShoppingCartButton" class="MobileNavigationButton ShoppingCartButton">
                        <img src="./assets/icons/shopping-trolley.svg" alt="shopping trolley icon">
                        <p id="idCurrentShoppingCartContent" class="CurrentShoppingCartContent">1</p>
                    </button>
                </a>
            </li>
        </ul>
    </nav>
    <!-- #endregion -->
    <!-- ------------------------------------------------------------- -->
</body>

</html>
